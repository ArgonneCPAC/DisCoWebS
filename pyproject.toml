[build-system]
requires = [
    "setuptools>=45",
    "setuptools_scm>=7",
    "tomli>=1.0.0; python_version >= '3.11'",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "DisCoWebS/_version.py"
write_to_template = "__version__ = '{version}'\n"

[tool.setuptools]
include-package-data = true
packages = {find = {exclude=["data*","optimizer","likelihood","modelling"]}}
package-data = {DisCoWebS = ["data/*.txt", "tests/testing_data/*.npy"]}
package-dir = {DisCoWebS = "DisCoWebS"}

[project.urls]
home = "https://github.com/ArgonneCPAC/DisCoWebS"

[project]
name = "DisCoWebS"
authors = [
    {name = "Kaustav Mitra", email = "kmitra@anl.gov"},
    {name = "Natália Villa Nova Rodrigues", email = "nvillanovarodrigues@anl.gov"},
    {name = "Andrew Hearin", email = "ahearin@anl.gov"},
    {name = "Kumail Zaidi", email = "kzaidi@anl.gov"},
]
description = "Diffsky joint modelling of Cosmos-Web and SDSS data"
readme = "README.rst"
requires-python = ">=3.11"
license = {file = "LICENSE.rst"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.flake8]
ignore = ["E203", "E226", "E231", "E501", "W503"]
per-file-ignores = [
    "__init__.py:F401",
]
max-line-length = 88
count = true
